<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Detective · Teacher sign-in</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/options.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="AI Detective game">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">AI Detective</span>
    </a>
  </header>
  <main class="sign-in">
    <p class="eyebrow">Teachers only</p>
    <h1>Teacher sign-in</h1>
    <p class="sign-in-message" id="message" role="status" hidden></p>
    <p>Sign in with your school account. Only teachers on the approved list can get in.</p>
    <div class="sign-in-buttons" id="buttons">
      <p class="muted" id="no-providers" hidden>Sign-in isn't set up on this server yet.</p>
    </div>
    <form class="code-sign-in" id="code-form" hidden>
      <label for="teacher-code">Or enter the teacher code</label>
      <div class="code-row">
        <input id="teacher-code" type="password" autocomplete="current-password" spellcheck="false" maxlength="200">
        <button class="btn primary" type="submit">Sign in</button>
      </div>
      <p class="join-error" id="code-error" role="alert" hidden></p>
    </form>
    <p class="fine-print">Students don't sign in. They join the game with their class code.</p>
    <p><a class="text-link" href="/">Back to the game</a></p>
  </main>
  <script src="/js/sign-in.js"></script>
</body>
</html>
